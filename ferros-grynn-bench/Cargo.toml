[package]
name = "ferros-grynn-bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bench]]
name = "collections"
harness = false

[[bench]]
name = "property_map"
harness = false

[[bench]]
name = "ecs"
harness = false

[[bench]]
name = "graph_core"
harness = false

[[bench]]
name = "atom_model"
harness = false

[[bench]]
name = "gql_stage_common"
harness = false

[[bench]]
name = "gql_stage20_21"
harness = false

[[bench]]
name = "gql_stage22_23"
harness = false

[[bench]]
name = "gql_stage26"
harness = false

[[bench]]
name = "gql_stage26_cache"
harness = false

[[bench]]
name = "gql_stage27_common"
harness = false

[[bench]]
name = "gql_stage27"
harness = false

[[bench]]
name = "gql_stage28"
harness = false

[[bench]]
name = "gql_stage29"
harness = false

[[bench]]
name = "gql_stage30"
