[workspace]
members = [
    "crates/ferros-grynn-macros",
    "ferros-grynn-bench"
]

[workspace.dependencies]
ferros-grynn = { path = ".", default-features = false }
ferros-grynn-macros = { path = "crates/ferros-grynn-macros" }
arrow = { version = "58.4.0", default-features = false }
datafusion = { version = "54.1.0", default-features = false }


[package]
name = "ferros-grynn"
authors = ["Vlayd Detect"]
edition = "2024"
version = "0.1.0"
description = "Embedded Graph Database Engine powered by Rust"
repository = "https://github.com/VlaydDetect/ferros-grynn"
homepage = "https://github.com/VlaydDetect/ferros-grynn"
keywords = [
    "database",
    "embedded-database",
    "graph",
    "graph-store",
]
categories = ["database-implementations", "data-structures", "embedded"]

[features]
default = ["columnar", "datafusion"]
columnar = ["dep:arrow"]
datafusion = ["columnar", "dep:datafusion"]

# -------------------- System API --------------------
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_SystemInformation"
] }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "uio", "feature"] }
# ----------------------------------------------------

# -------------------- Custom Allocator --------------------
[target.'cfg(target_env="msvc")'.dependencies]
mimalloc = "0.1.48"
[target.'cfg(not(target_env="msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"
# ----------------------------------------------------------

[dependencies]
ferros-grynn-macros = { path = "crates/ferros-grynn-macros" }

# --------- Platform ---------
sysinfo = "0.39.6"

# --------- Async ---------
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt", "rt-multi-thread"] }
dashmap = "7.0.0-rc2"
crossbeam = "0.8.4"
parking_lot = "0.12.5"
rayon = "1.11.0"
futures = "0.3.33"

# --------- Serialization ---------
binrw = "0.15.0"
rkyv = { version = "0.8.14", features = [] }

# --------- Collections ---------
slotmap = "1.1.1"
slot-cell = "0.1.2"
smallvec = "2.0.0-alpha.12"
rapidhash = "4.2.2"
thin-vec = "0.2.19"
reblessive = "0.4.3"

# --------- Data ---------
arrow = { workspace = true, optional = true }
datafusion = { workspace = true, optional = true }
bytes = "1.12.1"
compact_str = { version = "0.9.1", features = ["rkyv"] }
geo = "0.33.1"
geojson = "1.0.0"
jiff = "0.2.34"
humantime = "2.3.0"
rust_decimal = { version = "1.42.1" }
uuid = { version = "1.18.1", features = ["v4", "v7"] }
ulid = { version = "3.0.0" }

# --------- Error Handling ---------
thiserror = "2.0.17"
anyhow = "1.0.100"

# --------- Utils ---------
bitflags = "2.10.0"
itertools = { version = "0.15.0", features = ["use_std"] }
num = { version = "0.4.3", features = ["std"] }
num-traits = "0.2.19"
regex = "1.12.2"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"



# --------- Macros Utils ---------
derive_more = { version = "2.1.1", features = ["full"] }
paste = "1"
macro_rules_attribute = "0.2.2"
magic_utils = { git = "https://github.com/VlaydDetect/magic_utils.git", features = ["derive"] }

num-derive = "0.5.1"
path-clean = "1.0.1"

inventory = "0.3.21"

tracing = "0.1.41"
tracing-subscriber = "0.3.21"

[dev-dependencies]
memmap2 = "0.9.11"
proptest = "1.11.0"

# See: https://rust-lang.github.io/rust-clippy/master/index.html
[lints.clippy]
# TODO: missing_enforced_import_renames
# TODO: missing_inline_in_public_items
absurd_extreme_comparisons = "deny"
allow_attributes_without_reason = "deny"
bad_bit_mask = "deny"
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
cargo_common_metadata = "warn"
case_sensitive_file_extension_comparisons = "warn"
cloned_instead_of_copied = "warn"
cognitive_complexity = "warn"
collapsible_else_if = "warn"
comparison_chain = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "deny"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
doc_link_code = "warn"
doc_link_with_quotes = "warn"
elidable_lifetime_names = "warn"
enum_glob_use = "deny"
equatable_if_let = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
exit = "deny"
expect_used = "deny"
expl_impl_clone_on_copy = "warn"
fallible_impl_from = "deny"
float_cmp = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
format_collect = "warn"
format_push_string = "warn"
should_panic_without_expect = "deny"
if_then_some_else_none = "warn"
ignore_without_reason = "deny"
impl_trait_in_params = "warn"
inconsistent_struct_constructor = "warn"
index_refutable_slice = "warn"
infinite_loop = "deny"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "deny"
items_after_test_module = "deny"
iter_not_returning_iterator = "deny"
iter_without_into_iter = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_underscore_must_use = "warn"
linkedlist = "deny"
macro_use_imports = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
many_single_char_names = "warn"
map_err_ignore = "deny"
match_bool = "deny"
match_wild_err_arm = "deny"
match_wildcard_for_single_variants = "deny"
maybe_infinite_iter = "warn"
mem_forget = "deny"
mismatching_type_param_order = "deny"
#missing_const_for_fn = "warn"
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_fields_in_debug = "warn"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
multiple_inherent_impl = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_collect = "deny"
needless_continue = "warn"
needless_pass_by_ref_mut = "deny"
needless_type_cast = "deny"
no_effect_underscore_binding = "deny"
no_mangle_with_rust_abi = "warn"
non_send_fields_in_send_ty = "deny"
option_option = "warn"
overly_complex_bool_expr = "warn"
panic = "warn"
panic_in_result_fn = "warn"
partial_pub_fields = "deny"
precedence_bits = "deny"
pub_underscore_fields = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "deny"
redundant_pub_crate = "deny"
redundant_type_annotations = "warn"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "warn"
trivially_copy_pass_by_ref = "warn"
self_named_module_files = "deny"
semicolon_if_nothing_returned = "deny"
significant_drop_in_scrutinee = "warn"
struct_excessive_bools = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "deny"
todo = "deny"
trait_duplication_in_bounds = "deny"
trivial_regex = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
unnecessary_wraps = "warn"
unneeded_field_pattern = "warn"
unnested_or_patterns = "warn"
unused_async = "deny"
unused_self = "deny"
unwrap_in_result = "deny"
unwrap_used = "warn"
while_float = "deny"
wildcard_dependencies = "deny"
wildcard_imports = "deny"

# aggressive optimizations for benchmark consistency
[profile.release]
codegen-units = 1
lto = "fat"
incremental = false
opt-level = 3

# aggressive optimizations for benchmark consistency
[profile.bench]
codegen-units = 1
lto = "fat"
incremental = false
opt-level = 3
debug = true
debug-assertions = false
strip = false
