[workspace]
members = [
    "crates/ferros-grynn-macros"
]

[package]
name = "ferros-grynn"
authors = ["Vlayd Detect"]
edition = "2024"
version = "0.1.0"
description = "Embedded Graph Database Engine powered by Rust"
repository = "https://github.com/VlaydDetect/ferros-grynn"
homepage = "https://github.com/VlaydDetect/ferros-grynn"
keywords = [
    "database",
    "embedded-database",
    "graph",
    "graph-store",
]
categories = ["database-implementations", "data-structures", "embedded"]

# -------------------- System API --------------------
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_SystemInformation"
] }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["fs", "uio", "feature"] }
# ----------------------------------------------------

# -------------------- Custom Allocator --------------------
[target.'cfg(target_env="msvc")'.dependencies]
mimalloc = "0.1.48"
[target.'cfg(not(target_env="msvc"))'.dependencies]
tikv-jemallocator = "0.6.1"
# ----------------------------------------------------------

[dependencies]
ferros-grynn-macros = { path = "crates/ferros-grynn-macros" }

# --------- Platform ---------
sysinfo = "0.37.2"

# --------- Async ---------
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt", "rt-multi-thread"] }
dashmap = "7.0.0-rc2"
crossbeam = "0.8.4"
parking_lot = "0.12.5"
rayon = "1.11.0"


# --------- Error Handling ---------
thiserror = "2.0.17"
anyhow = "1.0.100"

# --------- Utils ---------
bitflags = "2.10.0"
lazy_static = "1.5.0"
itertools = { version = "0.14.0", features = ["use_std"] }
uuid = { version = "1.18.1", features = ["v4", "v7"] }
humantime = "2.3.0"
chrono = { version = "0.4.42", features = ["std", "clock"] }
jiff = { version = "0.2.17" }
num = { version = "0.4.3", features = ["std"] }
num-traits = "0.2.19"
regex = "1.12.2"
once_cell = "1.21.3"
serde = { version = "1.0.228", features = ["derive"] }



# --------- Macros Utils ---------
derive_more = { version = "2.1.1", features = ["full"] }
paste = "1"
macro_rules_attribute = "0.2.2"
magic_utils = { git = "https://github.com/VlaydDetect/magic_utils.git", features = ["derive"] }

num-derive = "0.4.2"
path-clean = "1.0.1"

inventory = "0.3.21"

tracing = "0.1.41"
tracing-subscriber = "0.3.21"
