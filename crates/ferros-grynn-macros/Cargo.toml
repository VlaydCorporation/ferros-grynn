[package]
name = "ferros-grynn-macros"
authors = ["Vlayd Detect"]
edition = "2024"
version = "0.1.0"
description = "Procedural macros for Ferros-Grynn values and typed statuses"
license = "Apache-2.0"
repository = "https://github.com/VlaydCorporation/ferros-grynn"
readme = "../../README.md"
keywords = ["database", "macros", "gql"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = { version = "1" }
darling = { version = "0.23.0", features = ["suggestions"] }
