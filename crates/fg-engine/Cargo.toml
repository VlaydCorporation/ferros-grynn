[package]
name = "fg-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Datastore, physical storage and GQL execution for Ferros-Grynn"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
native-async-io = []
bridge-surreal = ["dep:surrealdb"]
bridge-surreal-mem = ["bridge-surreal", "surrealdb/kv-mem"]
bridge-surreal-rocksdb = ["bridge-surreal", "surrealdb/kv-rocksdb"]
allocation-tracking = ["fg-memory/allocation-tracking"]
storage-engine-prototype-api = []

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dependencies]
fg-value-codec.workspace = true
fg-runtime.workspace = true
fg-syntax.workspace = true
fg-memory = { workspace = true }
fg-gql-status = { workspace = true }

# --------- Platform ---------
sysinfo = { workspace = true }

# --------- Async ---------
tokio = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }

# --------- Serialization ---------
rkyv = { workspace = true }

# --------- Collections ---------
smallvec = { workspace = true }
rapidhash = { workspace = true }
thin-vec = { workspace = true }
reblessive = { workspace = true }

# --------- Data ---------
surrealdb = { workspace = true, optional = true }
compact_str = { workspace = true }
geojson = { workspace = true }
geo = { workspace = true }
jiff = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
half = { workspace = true }

# --------- Search ---------
deunicode = { workspace = true }
diskann = { workspace = true }
diskann-vector = { workspace = true }
rust-stemmers = { workspace = true }

# --------- Utils ---------
bitflags = { workspace = true }
num = { workspace = true }
num-traits = { workspace = true }
regex = { workspace = true }
icu_collator = { workspace = true }
icu_normalizer = { workspace = true }
serde_json = { workspace = true }


[dev-dependencies]
fg-runtime = { workspace = true, features = ["test-support"] }
fg-test-support = { workspace = true }
fg-memory = { workspace = true, features = ["test-support"] }
flate2.workspace = true
proptest = { workspace = true }
memmap2 = { workspace = true }
dashmap = { workspace = true }

[target.'cfg(target_env="msvc")'.dev-dependencies]
mimalloc-pprof = { workspace = true }

[target.'cfg(not(target_env="msvc"))'.dev-dependencies]
pprof = { workspace = true }

# See: https://rust-lang.github.io/rust-clippy/master/index.html
